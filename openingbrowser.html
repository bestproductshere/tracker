<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Link...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0071e3; /* Browser Blue styling */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #0071e3;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Opening Browser...</h2>
    <p>Please click "Continue" or "Open" if your device prompts you.</p>
    
    <a id="app-link" href="https://goli.com/pages/goli-bundles?discount_code=blooming" class="btn">Click here if not redirected</a>

    <script>
        (function() {
            var targetUrl = "https://goli.com/pages/goli-bundles?discount_code=blooming";
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // 1. Android - Try forcing Chrome using Android Intents
            if (/android/i.test(userAgent)) {
                // Strips the protocol 'https://' from the URL for Android intent format
                var cleanUrl = targetUrl.replace(/https?:\/\//, "");
                var androidChromeIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
                
                window.location.href = androidChromeIntent;

                // Android Fallback: If Chrome intent fails, use direct web location
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 1500);

            // 2. iOS (iPhone/iPad) & Desktop Safari/Browsers
            } else {
                // iOS handles this seamlessly via standard navigation, routing to Safari/Default browser
                window.location.href = targetUrl;
            }

            // Update the HTML button href to match the destination link for backup manual clicks
            document.getElementById("app-link").setAttribute("href", targetUrl);
        })();
    </script>
</body>
</html>
