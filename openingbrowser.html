<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Chrome App...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285F4; /* Chrome Blue */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #4285F4; /* Chrome Blue */
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Opening Google Chrome...</h2>
    <p>Please click "Continue" or "Open" if your browser prompts you.</p>
    
    <a id="app-link" href="intent://google.com/#Intent;scheme=https;package=com.android.chrome;end;" class="btn">Open Chrome App</a>

    <script>
        (function() {
            // Android Intent syntax targeting the stable Chrome package
            // This forces Android to intercept the URL and handle it via Chrome
            var chromeIntentUrl = "intent://google.com/#Intent;scheme=https;package=com.android.chrome;end;";
            
            // Fallback web URL if the browser completely blocks the intent redirect
            var webFallbackUrl = "https://www.google.com";

            // Attempt to trigger the instant pop-up / redirect on load
            window.location.href = chromeIntentUrl;

            // Fallback safety: If the user remains on the page, redirect to standard web
            setTimeout(function() {
                if (!document.hidden) {
                    window.location.href = webFallbackUrl;
                }
            }, 2500);
        })();
    </script>
</body>
</html>
