<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007aff; /* Standard Mobile Blue */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 28px;
            background-color: #007aff;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Opening in external browser...</h2>
    <p>If you are not redirected automatically, please click the button below.</p>
    
    <a id="redirect-link" href="https://goli.com/pages/goli-bundles?discount_code=blooming" class="btn">Open Link</a>

    <script>
        (function() {
            var targetUrl = "https://goli.com/pages/goli-bundles?discount_code=blooming";
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Android specific intent routing to break out of in-app browsers
            if (/android/i.test(userAgent)) {
                var androidIntentUrl = "intent://goli.com/pages/goli-bundles?discount_code=blooming#Intent;scheme=https;package=com.android.chrome;end;";
                
                // Update the button for manual fallback
                document.getElementById('redirect-link').href = androidIntentUrl;
                
                // Trigger automatic attempt
                window.location.href = androidIntentUrl;
            } else {
                // iOS / Generic handling
                // In-app browsers on iOS often block programmatic window.location calls to external apps
                // User interaction via the button is typically required.
                window.location.href = targetUrl;
            }

            // Fallback timeout to regular URL if the intent fails or app isn't installed
            setTimeout(function() {
                if (!document.hidden) {
                    window.location.href = targetUrl;
                }
            }, 3000);
        })();
    </script>
</body>
</html>
