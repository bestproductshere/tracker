<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Link...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007aff; 
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007aff;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Opening Link...</h2>
    <p>Please click "Continue" or "Open" if your browser prompts you.</p>
    
    <a id="app-link" href="intent://goli.com/pages/goli-bundles?discount_code=blooming#Intent;scheme=https;package=com.android.chrome;end;" class="btn">Open Link</a>

    <script>
        (function() {
            var targetUrl = "https://goli.com/pages/goli-bundles?discount_code=blooming";
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Android check: Force the native browser application prompt instantly
            if (/android/i.test(userAgent)) {
                var androidIntent = "intent://goli.com/pages/goli-bundles?discount_code=blooming#Intent;scheme=https;package=com.android.chrome;end;";
                window.location.href = androidIntent;
            } else {
                // iOS / Standard check: Attempt instant redirection
                window.location.href = targetUrl;
            }

            // Fallback safety: If the system prompt is canceled or ignored, 
            // redirect via the standard web path after 2.5 seconds.
            setTimeout(function() {
                if (!document.hidden) {
                    window.location.href = targetUrl;
                }
            }, 2500);
        })();
    </script>
</body>
</html>
