<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Browser...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF9900; /* Loader Color */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #FF9900;
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Opening Link...</h2>
    <p>Please click "Continue" or "Open" if your browser prompts you.</p>
    
    <a id="app-link" href="https://goli.com/pages/goli-bundles?discount_code=blooming" class="btn">Open Link</a>

    <script>
        (function() {
            var targetUrl = "goli.com/pages/goli-bundles?discount_code=blooming";
            var fullUrl = "https://" + targetUrl;
            
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var appUrl = fullUrl; // Default fallback

            // 1. Determine Device and set up specific browser custom URL scheme
            if (/android/i.test(userAgent)) {
                // Android intent logic to specifically force open in Google Chrome
                appUrl = "intent://" + targetUrl + "#Intent;scheme=https;package=com.android.chrome;end";
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // iOS logic to specifically force open in native Safari app 
                appUrl = "x-web-search://?" + targetUrl;
            }

            // Update the HTML manual button just in case
            document.getElementById("app-link").href = appUrl;

            // 2. Attempt to trigger the native browser application prompt immediately on load
            window.location.href = appUrl;

            // 3. Fallback safety: If deep-linking fails or user stays on page, open natively
            setTimeout(function() {
                if (!document.hidden) {
                    window.location.href = fullUrl;
                }
            }, 2500);
        })();
    </script>
</body>
</html>
